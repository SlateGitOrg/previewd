# previewd controller deployment. Build and push your own image and set it
# below; this repository does not publish one.
apiVersion: v1
kind: Namespace
metadata:
  name: previewd-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: previewd
  namespace: previewd-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: previewd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: previewd
subjects:
  - kind: ServiceAccount
    name: previewd
    namespace: previewd-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: previewd
  namespace: previewd-system
  labels:
    app.kubernetes.io/name: previewd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: previewd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: previewd
    spec:
      serviceAccountName: previewd
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: previewd
          image: previewd:dev
          args:
            - serve
            - --leader-elect
            - --leader-election-namespace=previewd-system
            - --templates-dir=/etc/previewd/templates
            - --repos=acme/*
            - --webhook-secret-file=/etc/previewd/secrets/webhook-secrets
            - --github-token-file=/etc/previewd/secrets/github-token
          ports:
            - {name: webhook, containerPort: 8090}
            - {name: metrics, containerPort: 8080}
            - {name: probes, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: templates, mountPath: /etc/previewd/templates/default, readOnly: true}
            - {name: secrets, mountPath: /etc/previewd/secrets, readOnly: true}
      volumes:
        - name: templates
          configMap:
            name: previewd-template-default
            # kubectl -n previewd-system create configmap previewd-template-default \
            #   --from-file=templates/default/templateset.yaml --from-file=templates/default/manifests/
            items:
              - {key: templateset.yaml, path: templateset.yaml}
              - {key: 10-config.yaml, path: manifests/10-config.yaml}
              - {key: 20-app.yaml, path: manifests/20-app.yaml}
              - {key: 30-ingress.yaml, path: manifests/30-ingress.yaml}
        - name: secrets
          secret:
            secretName: previewd-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: previewd-webhook
  namespace: previewd-system
spec:
  selector:
    app.kubernetes.io/name: previewd
  ports:
    - {name: webhook, port: 80, targetPort: webhook}
---
apiVersion: v1
kind: Service
metadata:
  name: previewd-metrics
  namespace: previewd-system
  labels:
    app.kubernetes.io/name: previewd
spec:
  selector:
    app.kubernetes.io/name: previewd
  ports:
    - {name: metrics, port: 8080, targetPort: metrics}
