---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: previewenvironments.previewd.dev
spec:
  group: previewd.dev
  names:
    kind: PreviewEnvironment
    listKind: PreviewEnvironmentList
    plural: previewenvironments
    shortNames:
    - pe
    - preview
    singular: previewenvironment
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repository.name
      name: Repo
      type: string
    - jsonPath: .spec.pullRequest.number
      name: PR
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PreviewEnvironment is one ephemeral environment for one pull
          request.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PreviewEnvironmentSpec is the desired state, written by the webhook intake
              (or by hand) and read by the reconciler.
            properties:
              lastActivityTime:
                description: |-
                  LastActivityTime is the SCM-side updated_at of the most recent event
                  applied to this spec. It anchors the TTL and orders out-of-order
                  webhook deliveries.
                format: date-time
                type: string
              pullRequest:
                description: PullRequestRef carries the pull-request facts the controller
                  renders from.
                properties:
                  author:
                    description: Author is the login of the pull request author.
                    type: string
                  baseRef:
                    description: BaseRef is the target branch name.
                    type: string
                  draft:
                    description: Draft is true when the pull request is a draft.
                    type: boolean
                  headRef:
                    description: HeadRef is the source branch name.
                    type: string
                  headSHA:
                    description: HeadSHA is the commit the preview should run.
                    pattern: ^[0-9a-f]{7,64}$
                    type: string
                  labels:
                    description: Labels are the pull request labels at the time of
                      the last event.
                    items:
                      type: string
                    type: array
                  number:
                    description: Number is the pull request number.
                    minimum: 1
                    type: integer
                  title:
                    description: Title is the pull request title, for display only.
                    type: string
                required:
                - headSHA
                - number
                type: object
              repository:
                description: RepositoryRef identifies the source repository of the
                  pull request.
                properties:
                  name:
                    description: Name is the repository name without the owner.
                    minLength: 1
                    type: string
                  owner:
                    description: Owner is the user or organisation that owns the repository.
                    minLength: 1
                    type: string
                required:
                - name
                - owner
                type: object
              state:
                description: State is the pull request state.
                enum:
                - open
                - closed
                type: string
              template:
                default: default
                description: Template names the template set used to render the environment.
                type: string
              ttl:
                description: |-
                  TTL overrides the template set's time-to-live. The environment
                  expires at lastActivityTime + TTL.
                type: string
            required:
            - lastActivityTime
            - pullRequest
            - repository
            - state
            type: object
          status:
            description: PreviewEnvironmentStatus is the observed state written by
              the reconciler.
            properties:
              appliedHash:
                description: AppliedHash is the content hash of the last successfully
                  applied bundle.
                type: string
              appliedSHA:
                description: AppliedSHA is the head commit of the last applied bundle.
                type: string
              conditions:
                description: Conditions follow the Kubernetes condition conventions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                description: ExpiresAt is when the TTL elapses.
                format: date-time
                type: string
              failureCount:
                description: FailureCount counts consecutive render/apply failures
                  (drives backoff).
                format: int32
                type: integer
              lastReported:
                description: LastReported is the last status posted to the SCM.
                properties:
                  sha:
                    type: string
                  state:
                    type: string
                required:
                - sha
                - state
                type: object
              message:
                description: Message is a human-readable explanation of the phase.
                type: string
              namespace:
                description: Namespace is the Kubernetes namespace that hosts the
                  environment.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  reflects.
                format: int64
                type: integer
              phase:
                description: Phase is the coarse lifecycle phase.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Failed
                - TearingDown
                - Closed
                - Expired
                type: string
              resources:
                description: Resources is the number of objects in the last applied
                  bundle.
                format: int32
                type: integer
              terminatedAt:
                description: TerminatedAt is when the environment reached Closed or
                  Expired.
                format: date-time
                type: string
              url:
                description: URL is the public URL of the preview, if the template
                  defines one.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
